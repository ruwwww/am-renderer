<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>am-renderer — Playback Preview Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0c0c0e;
            color: #e2e2e9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background-color: #121216;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }
        header h1 span {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.connected {
            background-color: #10b981;
        }
        .preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #08080a;
            padding: 24px;
            min-height: 450px;
            position: relative;
        }
        canvas {
            max-width: 100%;
            max-height: 400px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            background-image: linear-gradient(45deg, #18181b 25%, transparent 25%), 
                              linear-gradient(-45deg, #18181b 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #18181b 75%), 
                              linear-gradient(-45deg, transparent 75%, #18181b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .controls {
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #8b5cf6;
            cursor: pointer;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-group {
            display: flex;
            gap: 12px;
        }
        button {
            background-color: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #272732;
            border-color: rgba(255, 255, 255, 0.2);
        }
        button.active {
            background-color: #8b5cf6;
            border-color: transparent;
        }
        select {
            background-color: #1c1c24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
        }
        .metrics {
            font-size: 0.8rem;
            color: #a1a1aa;
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>am-renderer // <span>WS Playback Scheduler</span></h1>
        <div style="display: flex; align-items: center;">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText" style="font-size: 0.85rem; color: #a1a1aa;">Disconnected</span>
        </div>
    </header>

    <div class="preview-area">
        <canvas id="previewCanvas" width="720" height="1280"></canvas>
    </div>

    <div class="controls">
        <div class="slider-row">
            <span style="font-size: 0.85rem; color: #a1a1aa; width: 40px;" id="frameDisplay">0</span>
            <input type="range" id="frameSlider" min="0" max="509" value="0">
            <span style="font-size: 0.85rem; color: #a1a1aa; width: 40px; text-align: right;">509</span>
        </div>

        <div class="btn-row">
            <div class="btn-group">
                <button id="playBtn">PLAY</button>
                <button id="pauseBtn" class="active">PAUSE</button>
            </div>

            <div class="btn-group">
                <select id="scaleSelect">
                    <option value="0.10">0.10x (Ultra Fast)</option>
                    <option value="0.25">0.25x (Fast)</option>
                    <option value="0.50" selected>0.50x (Medium)</option>
                    <option value="1.00">1.00x (Full)</option>
                </select>
            </div>

            <div class="metrics">
                <span id="fpsMetric">FPS: --</span>
                <span id="latencyMetric">Latency: --ms</span>
            </div>
        </div>
    </div>
</div>

<script>
    let ws = null;
    let isPlaying = false;
    let lastFrameTime = performance.now();
    let frameCount = 0;
    let fpsInterval = null;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const frameSlider = document.getElementById('frameSlider');
    const frameDisplay = document.getElementById('frameDisplay');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const scaleSelect = document.getElementById('scaleSelect');
    const fpsMetric = document.getElementById('fpsMetric');
    const latencyMetric = document.getElementById('latencyMetric');

    // Connect to WebSocket Server
    function connect() {
        ws = new WebSocket('ws://localhost:8080/ws');
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
            statusDot.className = 'status-dot connected';
            statusText.textContent = 'Connected';
            console.log('Connected to preview server');
        };

        ws.onclose = () => {
            statusDot.className = 'status-dot';
            statusText.textContent = 'Disconnected';
            console.log('Disconnected from preview server. Reconnecting...');
            setTimeout(connect, 2000);
        };

        ws.onmessage = async (event) => {
            const buffer = event.data;
            if (buffer instanceof ArrayBuffer) {
                // Parse binary header: 4 bytes frame index
                const view = new DataView(buffer);
                const frameIndex = view.getUint32(0);
                
                // Get WebP payload bytes
                const payload = new Uint8Array(buffer, 4);
                
                // Convert to Blob and draw to canvas
                const blob = new Blob([payload], { type: 'image/webp' });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    // Update canvas resolution dynamically on first load or changes
                    if (canvas.width !== img.width || canvas.height !== img.height) {
                        canvas.width = img.width;
                        canvas.height = img.height;
                    }
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    
                    // Update UI playhead
                    frameSlider.value = frameIndex;
                    frameDisplay.textContent = frameIndex;

                    // Calculate metrics
                    const now = performance.now();
                    frameCount++;
                    const latency = (now - lastFrameTime).toFixed(0);
                    latencyMetric.textContent = `Latency: ${latency}ms`;
                    lastFrameTime = now;
                };
                img.src = url;
            }
        };
    }

    // Controls
    frameSlider.addEventListener('input', (e) => {
        const frame = parseInt(e.target.value);
        frameDisplay.textContent = frame;
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'seek', frame: frame }));
        }
    });

    playBtn.addEventListener('click', () => {
        playBtn.classList.add('active');
        pauseBtn.classList.remove('active');
        isPlaying = true;
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'play' }));
        }
        
        // Start FPS tracking
        fpsInterval = setInterval(() => {
            fpsMetric.textContent = `FPS: ${frameCount}`;
            frameCount = 0;
        }, 1000);
    });

    pauseBtn.addEventListener('click', () => {
        pauseBtn.classList.add('active');
        playBtn.classList.remove('active');
        isPlaying = false;
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'pause' }));
        }
        clearInterval(fpsInterval);
        fpsMetric.textContent = 'FPS: --';
    });

    scaleSelect.addEventListener('change', (e) => {
        const scale = parseFloat(e.target.value);
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'config', scale: scale }));
        }
    });

    // Start
    connect();
</script>
</body>
</html>
