[package]
name = "am-renderer"
version = "0.1.0"
edition = "2021"
description = "Headless renderer for Alight Motion XML projects"

[dependencies]
# XML parsing
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }

# Image processing
image = "0.25"

# Math
glam = { version = "0.29", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
log = "0.4"
env_logger = "0.11"
