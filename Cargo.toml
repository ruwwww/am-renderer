[package]
name = "am-renderer"
version = "0.1.0"
edition = "2021"
description = "Headless renderer for Alight Motion XML projects"

[dependencies]
graph-resolver = { path = "packages/graph-resolver" }
alight-parser = { path = "packages/alight-parser" }
renderer-core = { path = "packages/renderer-core" }
export-service = { path = "packages/export-service" }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Config file
toml = "0.8"
serde = { version = "1", features = ["derive"] }
image = "0.25"

# Logging
log = "0.4"
env_logger = "0.11"

[workspace]
members = [
    "packages/graph-resolver",
    "packages/alight-parser",
    "packages/renderer-core",
    "packages/export-service",
    "packages/preview-service",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
